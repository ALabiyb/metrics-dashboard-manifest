# EXAMPLE ONLY — never apply this file as-is or commit real secrets.
# Create the secret imperatively on the cluster:
#
#   HASH_ADMIN=$(kubectl run --rm -it hash --image=docker.io/munimdevops/devops:metrics-dashboard \
#     --restart=Never -- hash-password 'change-me-admin' 2>/dev/null)
#   SESSION_SECRET=$(openssl rand -base64 32)
#   EMBED_TOKEN=$(openssl rand -hex 32)
#
#   kubectl create secret generic dashboard-auth -n metrics-dashboard \
#     --from-literal=DASHBOARD_USERS="[
#       {\"username\":\"admin\",\"password_hash\":\"${HASH_ADMIN}\",\"role\":\"admin\"}
#     ]" \
#     --from-literal=SESSION_SECRET="${SESSION_SECRET}" \
#     --from-literal=EMBED_TOKEN="${EMBED_TOKEN}" \
#     --from-literal=OIDC_CLIENT_SECRET="<keycloak-client-secret>"
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth
type: Opaque
stringData:
  DASHBOARD_USERS: |
    [
      {"username": "admin",  "password_hash": "$2a$10$REPLACE_WITH_BCRYPT_HASH", "role": "admin"},
      {"username": "viewer", "password_hash": "$2a$10$REPLACE_WITH_BCRYPT_HASH", "role": "viewer"}
    ]
  SESSION_SECRET: "REPLACE-openssl-rand-base64-32"
  EMBED_TOKEN: "REPLACE-openssl-rand-hex-32"
  OIDC_CLIENT_SECRET: "REPLACE-keycloak-client-secret"
