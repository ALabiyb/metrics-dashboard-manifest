apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-dashboard-dev
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-sync-failed.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-health-status-change.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-pod-crash-loop.email: admin@nexbridge.co.tz
spec:
  project: default
  source:
    repoURL: https://github.com/ALabiyb/metrics-dashboard-manifest.git
    targetRevision: dev           # dev branch = development builds (image tag = build number)
    path: k8s
  destination:
    server: https://kubernetes.default.svc   # dev cluster (same cluster as ArgoCD)
    namespace: metrics-dashboard-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
