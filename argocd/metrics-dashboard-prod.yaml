apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-dashboard-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-sync-failed.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-health-status-change.email: admin@nexbridge.co.tz
    notifications.argoproj.io/subscribe.on-pod-crash-loop.email: admin@nexbridge.co.tz
spec:
  project: default
  source:
    repoURL: https://github.com/ALabiyb/metrics-dashboard-manifest.git
    targetRevision: prod          # prod branch = production releases (image tag = version e.g. 1.2.0)
    path: k8s
  destination:
    # Apply this on the prod cluster's own ArgoCD instance
    server: https://kubernetes.default.svc
    namespace: metrics-dashboard-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
