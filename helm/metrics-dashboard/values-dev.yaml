#
# Layer on top of values.yaml: helm template . -f values.yaml -f values-dev.yaml
# Reproduces the current live dev environment (namespace metrics-dashboard-dev,
# same cluster as uat/prod, isolated by namespace — see this chart's README).

image:
  repository: "harbor.devops.softnethq.co.tz/k8s_dashboard/metrics-dashboard"
  tag: "23"

# The real dashboard-auth Secret is created out-of-band (imperatively, so it
# survives ArgoCD selfHeal) - Helm must not try to create/own its own copy,
# or it'll fight the real one with blank DASHBOARD_USERS/OIDC_CLIENT_SECRET.
secret:
  create: false
  existingSecretName: "dashboard-auth"

branding:
  clusterName: "dev-cluster"

dataSource:
  prometheusUrl: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
  alertmanagerUrl: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093"

links:
  dashboardUrl: "https://metrics-dashboard.dev.softnethq.co.tz"
  k8sDashboardUrl: "https://k8s-dashboard.dev.softnethq.co.tz"
  argocdUrl: "https://argocd.devops.softnethq.co.tz"

oidc:
  issuerUrl: "https://keycloak.devops.softnethq.co.tz/realms/SoftNet%20AD"
  redirectUrl: "https://metrics-dashboard.dev.softnethq.co.tz/login/oidc/callback"
  adminGroup: "k8s-cluster-admins,k8s-platform-admins"
  scopedViewerGroups: "vfd-group:vfd-"

httpRoute:
  hostnames:
    - "metrics-dashboard.dev.softnethq.co.tz"

alerting:
  emailTo:
    - "lsaid@softnet.co.tz"
  smtp:
    fromName: "InfraWatch"
    from: "donotreply@softnet.co.tz"
  routes:
    clusterNodes:
      - "dfaustine@softnet.co.tz"
    vfd:
      - "mmshana@softnet.co.tz"
    gitlabDevops:
      - "lsaid@softnet.co.tz"
