#
# WARNING: this renders real credentials straight into the Secret from
# plain Helm values, which land in `helm get values`/release history same
# as anything else. That's fine for a quick local/dev install, but for a
# real deployment set secret.create: false and secret.existingSecretName to
# a Secret created out-of-band (kubectl create secret --from-literal,
# sealed-secrets, external-secrets, or Vault) instead — which is exactly
# how the live dev/uat/prod environments on the softnet.co.tz cluster do it
# today (see this chart's README).
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metrics-dashboard.secretName" . }}
  labels:
    {{- include "metrics-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DASHBOARD_USERS: {{ .Values.secret.dashboardUsers | quote }}
  SESSION_SECRET: {{ .Values.secret.sessionSecret | quote }}
  EMBED_TOKEN: {{ .Values.secret.embedToken | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secret.oidcClientSecret | quote }}
  {{- if .Values.secret.smtpUsername }}
  SMTP_USERNAME: {{ .Values.secret.smtpUsername | quote }}
  {{- end }}
  {{- if .Values.secret.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secret.smtpPassword | quote }}
  {{- end }}
{{- end }}
