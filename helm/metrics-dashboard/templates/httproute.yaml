#
# Gateway API HTTPRoute — only rendered when httpRoute.enabled is true.
# Disable this on any cluster without the Gateway API CRDs
# (gateway.networking.k8s.io/v1) installed; the Service still works
# standalone via NodePort/port-forward/your own Ingress either way.
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name }}
  labels:
    {{- include "metrics-dashboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
{{- end }}
