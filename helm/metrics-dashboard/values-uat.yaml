#
# Layer on top of values.yaml: helm template . -f values.yaml -f values-uat.yaml
# Reproduces the current live uat environment (namespace metrics-dashboard-uat,
# same cluster as dev/prod, isolated by namespace).

image:
  repository: "harbor.devops.softnethq.co.tz/k8s_dashboard/metrics-dashboard"
  # The live uat branch's k8s/02-deployment.yaml still carries the
  # CHANGE_ME_tag placeholder as of this chart's creation — uat's build
  # pipeline hasn't pinned a real tag yet. Fill this in with the actual
  # tag before using this values file for a real uat deploy.
  tag: "CHANGE_ME_tag"

branding:
  clusterName: "uat-cluster"

dataSource:
  prometheusUrl: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
  alertmanagerUrl: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093"

links:
  dashboardUrl: "https://metrics-dashboard.uat.softnethq.co.tz"
  k8sDashboardUrl: "https://k8s-dashboard.uat.softnethq.co.tz"
  argocdUrl: "https://argocd.devops.softnethq.co.tz"

oidc:
  issuerUrl: "https://keycloak.devops.softnethq.co.tz/realms/SoftNet%20AD"
  redirectUrl: "https://metrics-dashboard.uat.softnethq.co.tz/login/oidc/callback"
  adminGroup: "k8s-cluster-admins,k8s-platform-admins"
  scopedViewerGroups: "vfd-group:vfd-"

httpRoute:
  hostnames:
    - "metrics-dashboard.uat.softnethq.co.tz"

alerting:
  emailTo:
    - "lsaid@softnet.co.tz"
  smtp:
    fromName: "InfraWatch"
    from: "donotreply@softnet.co.tz"
  routes:
    clusterNodes:
      - "dfaustine@softnet.co.tz"
    vfd:
      - "mmshana@softnet.co.tz"
    gitlabDevops:
      - "lsaid@softnet.co.tz"
