apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-dashboard
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: harbor.devops.softnethq.co.tz/k8s_dashboard/metrics-dashboard:7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: PORT
            - name: DASHBOARD_USERS
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: DASHBOARD_USERS
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: SESSION_SECRET
            - name: EMBED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: EMBED_TOKEN
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: CLUSTER_NAME
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: PROMETHEUS_URL
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_REDIRECT_URL
            - name: OIDC_ADMIN_ROLE
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_ADMIN_ROLE
            - name: OIDC_TLS_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_TLS_SKIP_VERIFY
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
