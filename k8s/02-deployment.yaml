apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-dashboard
  namespace: metrics-dashboard-uat
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: harbor.devops.softnethq.co.tz/CHANGE_ME_harbor_project/metrics-dashboard:CHANGE_ME_tag
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            # ---- Core -------------------------------------------------------
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: PORT

            # ---- Auth (Secret) ----------------------------------------------
            - name: DASHBOARD_USERS
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: DASHBOARD_USERS
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: SESSION_SECRET
            - name: EMBED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: EMBED_TOKEN

            # ---- Data source ------------------------------------------------
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: PROMETHEUS_URL

            # ---- Branding / identity ----------------------------------------
            - name: APP_COMPANY_NAME
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: APP_COMPANY_NAME
            - name: APP_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: APP_CLUSTER_NAME
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: APP_ENV

            # ---- Alertmanager -----------------------------------------------
            - name: ALERTMANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ALERTMANAGER_URL

            # ---- Alerting (NOC email) ----------------------------------------
            - name: ALERT_EMAIL_TO
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ALERT_EMAIL_TO
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: SMTP_PORT
            - name: SMTP_FROM_NAME
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: SMTP_FROM_NAME
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: SMTP_FROM
            - name: ALERT_EMAIL_CLUSTER_NODES
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ALERT_EMAIL_CLUSTER_NODES
                  optional: true
            - name: ALERT_EMAIL_VFD
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ALERT_EMAIL_VFD
                  optional: true
            - name: ALERT_EMAIL_GITLAB_DEVOPS
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ALERT_EMAIL_GITLAB_DEVOPS
                  optional: true
            - name: DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: DASHBOARD_URL
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: SMTP_USERNAME
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: SMTP_PASSWORD
                  optional: true

            # ---- Cross-links ------------------------------------------------
            - name: K8S_DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: K8S_DASHBOARD_URL
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: ARGOCD_URL

            # ---- Keycloak SSO -----------------------------------------------
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_REDIRECT_URL
            - name: OIDC_ADMIN_GROUP
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_ADMIN_GROUP
            - name: OIDC_TLS_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: metrics-dashboard-config
                  key: OIDC_TLS_SKIP_VERIFY

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
