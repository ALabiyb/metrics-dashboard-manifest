apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-dashboard-config
  namespace: metrics-dashboard-dev
data:
  PORT: "8090"
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"

  # ---- Branding / identity ---------------------------------------------------
  APP_COMPANY_NAME: "InfraWatch"
  APP_CLUSTER_NAME: "dev-cluster"
  APP_ENV: "production"

  # ---- Alertmanager ----------------------------------------------------------
  ALERTMANAGER_URL: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093"

  # ---- Alerting (NOC email) --------------------------------------------------
  # ALERT_EMAIL_TO is always CC'd on top of whichever route below matches
  # (and is the sole recipient if nothing matches). SMTP_USERNAME/
  # SMTP_PASSWORD live in the dashboard-auth Secret instead, generated
  # imperatively (not tracked by GitOps here), so it survives ArgoCD
  # selfHeal.
  ALERT_EMAIL_TO: "admin@nexbridge.co.tz"
  SMTP_HOST: "smtp.zoho.com"
  SMTP_PORT: "587"
  SMTP_FROM_NAME: "InfraWatch"
  SMTP_FROM: "oncall-unmapped@nexbridge.co.tz"

  # Per-node-group routing: alerts about a cluster node, a vfd-* external
  # server, or gitlab/devops go to a different responsible person instead
  # of one shared inbox. Each is optional - leave blank to skip that group
  # (ALERT_EMAIL_TO above still applies to everything either way).
  ALERT_EMAIL_CLUSTER_NODES: "oncall-infra@nexbridge.co.tz"
  ALERT_EMAIL_VFD: "oncall-vfd@nexbridge.co.tz"
  ALERT_EMAIL_GITLAB_DEVOPS: "admin@nexbridge.co.tz"

  DASHBOARD_URL: "https://metrics-dashboard.dev.nexbridge.co.tz"

  # ---- Cross-links -----------------------------------------------------------
  K8S_DASHBOARD_URL: "https://k8s-dashboard.dev.nexbridge.co.tz"
  ARGOCD_URL: "https://argocd.devops.nexbridge.co.tz"

  # ---- Keycloak SSO ----------------------------------------------------------
  OIDC_ISSUER_URL: "https://keycloak.devops.nexbridge.co.tz/realms/NexBridge%20AD"
  OIDC_CLIENT_ID: "metrics-dashboard"
  OIDC_REDIRECT_URL: "https://metrics-dashboard.dev.nexbridge.co.tz/login/oidc/callback"
  # Comma-separated — platform-admins doesn't imply cluster-admins membership
  # in Keycloak, so both are listed explicitly to get admin here.
  OIDC_ADMIN_GROUP: "k8s-cluster-admins,k8s-platform-admins"
  OIDC_TLS_SKIP_VERIFY: "true"

  # Scoped viewers: a Keycloak group whose members only see external servers
  # whose name starts with the given prefix, nothing else in the dashboard.
  # Format: "group:prefix,group:prefix,...". Add more teams here later
  # without touching code — e.g. "vfd-group:vfd-,gitlab-team:gitlab-".
  # Requires the vfd-group to actually exist in Keycloak with members added;
  # harmless if the group is empty or doesn't exist yet.
  OIDC_SCOPED_VIEWER_GROUPS: "vfd-group:vfd-"
