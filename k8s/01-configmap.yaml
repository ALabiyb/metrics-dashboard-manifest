apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-dashboard-config
  namespace: metrics-dashboard-uat
data:
  PORT: "8090"
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"

  # ---- Branding / identity ---------------------------------------------------
  APP_COMPANY_NAME: "InfraWatch"
  APP_CLUSTER_NAME: "uat-cluster"
  APP_ENV: "production"

  # ---- Alertmanager ----------------------------------------------------------
  ALERTMANAGER_URL: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093"

  # ---- Alerting (NOC email) --------------------------------------------------
  ALERT_EMAIL_TO: ""
  SMTP_HOST: "smtp.zoho.com"
  SMTP_PORT: "587"
  SMTP_FROM_NAME: "SoftNet Metrics"
  SMTP_FROM: ""
  DASHBOARD_URL: "https://metrics-dashboard.uat.softnethq.co.tz"

  # ---- Cross-links -----------------------------------------------------------
  K8S_DASHBOARD_URL: "https://k8s-dashboard.uat.softnethq.co.tz"
  ARGOCD_URL: "https://argocd.devops.softnethq.co.tz"

  # ---- Keycloak SSO ----------------------------------------------------------
  OIDC_ISSUER_URL: "https://keycloak.devops.softnethq.co.tz/realms/SoftNet%20AD"
  OIDC_CLIENT_ID: "metrics-dashboard"
  OIDC_REDIRECT_URL: "https://metrics-dashboard.uat.softnethq.co.tz/login/oidc/callback"
  OIDC_ADMIN_GROUP: "k8s-cluster-admins"
  OIDC_TLS_SKIP_VERIFY: "true"
