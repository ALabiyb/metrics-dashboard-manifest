apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-dashboard-config
  namespace: metrics-dashboard-prod
data:
  PORT: "8090"
  # Prod cluster uses prometheus-stack helm release naming
  PROMETHEUS_URL: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090"

  CLUSTER_NAME: "prod-cluster"

  # Shown in the login page eyebrow badge
  APP_ENV: "Production"

  # --- Keycloak SSO (same realm as dev — shared Keycloak instance) ---------
  OIDC_ISSUER_URL: "https://keycloak.devops.softnethq.co.tz/realms/k8s%20dashboard"
  OIDC_CLIENT_ID: "metrics-dashboard"
  OIDC_REDIRECT_URL: "https://metrics-dashboard.prod.softnethq.co.tz/login/oidc/callback"
  OIDC_ADMIN_ROLE: "dashboard-admin"
  OIDC_TLS_SKIP_VERIFY: "true"
