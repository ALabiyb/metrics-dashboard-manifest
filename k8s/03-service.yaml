apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: metrics-dashboard-dev
  labels:
    app: dashboard
spec:
  selector:
    app: dashboard
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: tv
      port: 32030
      targetPort: http
      nodePort: 32030
      protocol: TCP
